<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arduino Academy</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#0b1120;
  color:#e5e7eb;
}

header{
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  padding:25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.progressBox{
  width:220px;
}

.progressText{
  font-size:13px;
  margin-bottom:6px;
}

.progress{
  width:100%;
  height:8px;
  background:#ffffff33;
  border-radius:10px;
  overflow:hidden;
}

.progressBar{
  height:100%;
  width:0%;
  background:#fff;
}

.layout{
  display:flex;
  min-height:calc(100vh - 80px);
}

.sidebar{
  width:300px;
  background:#111827;
  border-right:1px solid #263244;
  padding:20px;
  overflow-y:auto;
}

.sidebar h2{
  margin-bottom:15px;
}

.sectionTitle{
  color:#60a5fa;
  margin:20px 0 10px;
  font-size:14px;
}

.lessonBtn{
  width:100%;
  padding:12px;
  margin-bottom:7px;
  border:none;
  border-radius:9px;
  background:#1f2937;
  color:#d1d5db;
  text-align:left;
  cursor:pointer;
}

.lessonBtn:hover{
  background:#263449;
}

.lessonBtn.active{
  background:#2563eb;
  color:white;
}

.lessonBtn.done::after{
  content:" ✓";
  color:#4ade80;
}

main{
  flex:1;
  padding:30px;
  max-width:1200px;
  margin:auto;
  width:100%;
}

.lessonHeader{
  margin-bottom:25px;
}

.lessonHeader h1{
  font-size:32px;
  margin-bottom:8px;
}

.badge{
  display:inline-block;
  padding:5px 10px;
  background:#1e40af;
  border-radius:20px;
  font-size:12px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.card{
  background:#111827;
  border:1px solid #263244;
  border-radius:16px;
  padding:22px;
}

.card h2{
  margin-bottom:15px;
  color:#60a5fa;
}

.card p{
  line-height:1.7;
  color:#cbd5e1;
}

.code{
  background:#020617;
  padding:18px;
  border-radius:10px;
  overflow:auto;
  color:#93c5fd;
  font-family:Consolas,monospace;
  line-height:1.6;
  min-height:180px;
}

.copyBtn,
.actionBtn{
  border:none;
  padding:11px 16px;
  border-radius:8px;
  cursor:pointer;
  color:white;
  background:#2563eb;
  margin-top:12px;
}

.copyBtn:hover,
.actionBtn:hover{
  background:#1d4ed8;
}

.model{
  height:360px;
  border-radius:12px;
  overflow:hidden;
  background:#020617;
}

#threeContainer{
  width:100%;
  height:100%;
}

.parts{
  list-style:none;
}

.parts li{
  padding:10px;
  background:#1e293b;
  margin-bottom:7px;
  border-radius:8px;
}

.quiz{
  margin-top:20px;
}

.question{
  font-size:18px;
  margin-bottom:15px;
}

.answer{
  display:block;
  width:100%;
  text-align:left;
  padding:12px;
  margin:7px 0;
  background:#1e293b;
  color:white;
  border:1px solid #334155;
  border-radius:8px;
  cursor:pointer;
}

.answer:hover{
  background:#334155;
}

.result{
  margin-top:12px;
  font-weight:bold;
}

.navigation{
  display:flex;
  justify-content:space-between;
  margin-top:25px;
}

@media(max-width:900px){

  .layout{
    flex-direction:column;
  }

  .sidebar{
    width:100%;
    max-height:300px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  header{
    flex-direction:column;
    gap:15px;
  }

  main{
    padding:18px;
  }
}
</style>
</head>

    🔧 Arduino Academy

    </div>

    <div class="progress">

  </div>

<div id="section2"></div>

<main>

<span class="badge" id="duration"></span>

</div>


<div class="grid">

<!-- NAZARIYA -->

<div class="card">

<h2>📖 Nazariya</h2>

<p id="theory"></p>

</div>


<!-- 3D MODEL -->

<div class="card">

<div class="model">

<div id="threeContainer"></div>

</div>

<p style="margin-top:10px;color:#94a3b8">
Sichqoncha bilan modelni aylantiring.
</p>

</div>


<!-- KOD -->

<div class="card">

<pre class="code"><code id="code"></code></pre>

<button class="copyBtn" onclick="copyCode()">

</div>


<!-- KOMPONENTLAR -->

<div class="card">

<ul class="parts" id="parts"></ul>

</div>

</div>


<!-- QUIZ -->

<div class="card quiz">

<h2>📝 Mini test</h2>

<div class="question" id="question"></div>

<div id="answers"></div>

<div class="result" id="result"></div>

</div>


<div class="navigation">

<button class="actionBtn" onclick="previousLesson()">
⬅ Oldingi dars
</button>

<button class="actionBtn" onclick="completeLesson()">
✓ Darsni tugatish
</button>

<button class="actionBtn" onclick="nextLesson()">
Keyingi dars ➡
</button>

</div>

</main>

</div>

let current=0;

let completed =
JSON.parse(localStorage.getItem("arduinoCompleted") || "[]");


const title=document.getElementById("title");
const duration=document.getElementById("duration");
const theory=document.getElementById("theory");
const code=document.getElementById("code");
const parts=document.getElementById("parts");
const question=document.getElementById("question");
const answers=document.getElementById("answers");
const result=document.getElementById("result");


function buildSidebar(){

  const s1=document.getElementById("section1");
  const s2=document.getElementById("section2");

  s1.innerHTML="";
  s2.innerHTML="";

  lessons.forEach((lesson,index)=>{

    const button=document.createElement("button");

    button.className="lessonBtn";

    if(index===current)
      button.classList.add("active");

    if(completed.includes(index))
      button.classList.add("done");

    button.innerText=(index+1)+". "+lesson.title;

    button.onclick=()=>{
      current=index;
      loadLesson();
    };

    if(lesson.section===1)
      s1.appendChild(button);
    else
      s2.appendChild(button);

  });
}


function loadLesson(){

  const lesson=lessons[current];

  title.innerText=lesson.title;
  duration.innerText="⏱ "+lesson.duration;

  theory.innerText=lesson.theory;

  code.innerText=lesson.code;

  parts.innerHTML="";

  lesson.parts.forEach(part=>{
    const li=document.createElement("li");
    li.innerText="🔹 "+part;
    parts.appendChild(li);
  });


  question.innerText=lesson.question;

  answers.innerHTML="";
  result.innerText="";


  lesson.answers.forEach((answer,index)=>{

    const btn=document.createElement("button");

    btn.className="answer";

    btn.innerText=answer;

    btn.onclick=()=>{

      if(index===lesson.correct){

        result.innerText="✅ To‘g‘ri javob!";
        result.style.color="#4ade80";

      }else{

        result.innerText="❌ Noto‘g‘ri javob. Yana urinib ko‘ring.";
        result.style.color="#f87171";

      }

    };

    answers.appendChild(btn);

  });


  buildSidebar();

  updateProgress();

  create3D(lesson.model);

}


function completeLesson(){

  if(!completed.includes(current)){

    completed.push(current);

    localStorage.setItem(
      "arduinoCompleted",
      JSON.stringify(completed)
    );

  }

  updateProgress();

  buildSidebar();

}


function updateProgress(){

  let percent=
  Math.round((completed.length / lessons.length)*100);

  document.getElementById("progressText")
  .innerText=percent+"%";

  document.getElementById("progressBar")
  .style.width=percent+"%";

}


function nextLesson(){

  if(current < lessons.length-1){

    current++;

    loadLesson();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}


function previousLesson(){

  if(current > 0){

    current--;

    loadLesson();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}


function copyCode(){

  navigator.clipboard.writeText(
    lessons[current].code
  );

  alert("✅ Kod nusxalandi!");

}


/* ==========================
   3D MODEL
========================== */

let scene;
let camera;
let renderer;
let object;


function create3D(type){

  const container=
  document.getElementById("threeContainer");

  container.innerHTML="";


  scene=new THREE.Scene();

  scene.background=
  new THREE.Color(0x020617);


  camera=new THREE.PerspectiveCamera(
    45,
    container.clientWidth/container.clientHeight,
    0.1,
    1000
  );

  camera.position.set(0,2,6);


  renderer=new THREE.WebGLRenderer({
    antialias:true
  });

  renderer.setSize(
    container.clientWidth,
    container.clientHeight
  );

  container.appendChild(renderer.domElement);


  const light=
  new THREE.DirectionalLight(
    0xffffff,
    2
  );

  light.position.set(3,5,5);

  scene.add(light);


  scene.add(
    new THREE.AmbientLight(
      0xffffff,
      0.5
    )
  );


  object=createObject(type);

  scene.add(object);


  animate();

}


function createObject(type){

  const group=new THREE.Group();


  if(type==="arduino" || type==="board"){

    const board=
    new THREE.Mesh(

      new THREE.BoxGeometry(
        4,
        0.15,
        2.5
      ),

      new THREE.MeshStandardMaterial({
        color:0x126e51
      })

    );

    group.add(board);


    for(let i=0;i<14;i++){

      const pin=
      new THREE.Mesh(

        new THREE.BoxGeometry(
          0.08,
          0.35,
          0.08
        ),

        new THREE.MeshStandardMaterial({
          color:0xcccccc
        })

      );

      pin.position.x=-1.6+i*0.25;
      pin.position.y=0.25;
      pin.position.z=1.25;

      group.add(pin);

    }

  }


  else if(type==="led"){

    const base=
    new THREE.Mesh(

      new THREE.CylinderGeometry(
        0.55,
        0.55,
        0.25,
        32
      ),

      new THREE.MeshStandardMaterial({
        color:0x222222
      })

    );

    group.add(base);


    const led=
    new THREE.Mesh(

      new THREE.SphereGeometry(
        0.55,
        32,
        32
      ),

      new THREE.MeshStandardMaterial({
        color:0xff2222,
        emissive:0x330000
      })

    );

    led.position.y=0.55;

    group.add(led);

  }


  else if(type==="traffic"){

    for(let i=0;i<3;i++){

      const light=
      new THREE.Mesh(

        new THREE.SphereGeometry(
          0.55,
          32,
          32
        ),

        new THREE.MeshStandardMaterial({
          color:
            i===0?0xff0000:
            i===1?0xffff00:
            0x00ff00
        })

      );

      light.position.y=i*1.3-1.3;

      group.add(light);

    }

  }


  else if(type==="segment"){

    for(let i=0;i<7;i++){

      const segment=
      new THREE.Mesh(

        new THREE.BoxGeometry(
          0.18,
          0.7,
          0.1
        ),

        new THREE.MeshStandardMaterial({
          color:0xff2222,
          emissive:0x330000
        })

      );

      const angle=
      (Math.PI*2/7)*i;

      segment.position.x=
      Math.cos(angle)*0.45;

      segment.position.y=
      Math.sin(angle)*0.45;

      segment.rotation.z=
      angle;

      group.add(segment);

    }

  }


  else if(type==="servo"){

    const body=
    new THREE.Mesh(

      new THREE.BoxGeometry(
        1.4,
        1.4,
        0.8
      ),

      new THREE.MeshStandardMaterial({
        color:0x1565c0
      })

    );

    group.add(body);


    const arm=
    new THREE.Mesh(

      new THREE.BoxGeometry(
        0.15,
        1.8,
        0.15
      ),

      new THREE.MeshStandardMaterial({
        color:0xffffff
      })

    );

    arm.position.y=1.2;

    group.add(arm);

  }


  else if(type==="rgb"){

    const sphere=
    new THREE.Mesh(

      new THREE.SphereGeometry(
        0.8,
        32,
        32
      ),

      new THREE.MeshStandardMaterial({
        color:0x6633ff,
        emissive:0x220044
      })

    );

    group.add(sphere);

  }


  else if(type==="lcd"){

    const screen=
    new THREE.Mesh(

      new THREE.BoxGeometry(
        3.5,
        1.5,
        0.3
      ),

      new THREE.MeshStandardMaterial({
        color:0x064e3b
      })

    );

    group.add(screen);

  }


  else if(type==="buzzer"){

    const buzzer=
    new THREE.Mesh(

      new THREE.CylinderGeometry(
        0.8,
        0.8,
        0.5,
        32
      ),

      new THREE.MeshStandardMaterial({
        color:0x111111
      })

    );

    group.add(buzzer);

  }


  else{

    const cube=
    new THREE.Mesh(

      new THREE.BoxGeometry(
        1.5,
        1.5,
        1.5
      ),

      new THREE.MeshStandardMaterial({
        color:0x2563eb
      })

    );

    group.add(cube);

  }


  return group;

}


function animate(){

  requestAnimationFrame(animate);

  if(object){

    object.rotation.y+=0.008;

    object.rotation.x=
    Math.sin(Date.now()*0.001)*0.05;

  }

  renderer.render(scene,camera);

}


window.addEventListener("resize",()=>{

  const container=
  document.getElementById("threeContainer");

  if(camera && renderer){

    camera.aspect=
    container.clientWidth/
    container.clientHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      container.clientWidth,
      container.clientHeight
    );

  }

});


loadLesson();

</script>
